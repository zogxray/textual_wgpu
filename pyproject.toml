[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "textual-wgpu"
version = "0.19.0"
description = "Textual-compatible UI runtime on wgpu."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "textual-wgpu contributors" }]
dependencies = [
  "wgpu>=0.22",
  "rendercanvas>=2.0",
  "glfw>=2.6",
  "pillow>=10.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
parity = ["textual>=8.0"]

[project.scripts]
textual-wgpu-demo = "textual_wgpu.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/textual_wgpu"]

[tool.hatch.build.targets.wheel.sources]
"src/textual_wgpu" = "textual_wgpu"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
